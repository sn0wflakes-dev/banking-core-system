Configuration:
  Appenders:
    Console:
      name: "CONSOLE"
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss} [%t] %highlight{%-5level}{FATAL=bright red, ERROR=red, WARN=yellow, INFO=green, DEBUG=cyan, TRACE=blue} %logger{36} %notEmpty{ [messageId: %X{messageId}]} %msg%n"

    File:
      - name: "MAIN"
        fileName: "logs/SystemOutput.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} %notEmpty{ [messageId: %X{messageId}]} %msg%n"

  Loggers:
    Root:
      level: "INFO"
      AppenderRef:
        - ref: "CONSOLE"
          level: "DEBUG"
        - ref: "MAIN"